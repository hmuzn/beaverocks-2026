ion:fixed;inset:0;z-index:100;background:#192018;color:#fff;display:grid;place-items:center;padding:28px;animation:reveal .7s ease;text-align:center}.published-inner{max-width:480px}.published blockquote{font-size:30px;line-height:1.5;font-weight:700;margin:30px 0}.published .rating-number{color:#d5fc53}.published button{margin-top:30px}.published small{color:#d5fc53}@keyframes reveal{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}.route-box{background:#252f23;color:white;padding:17px;border-radius:17px;margin-top:15px}.route-box strong{color:#d5fc53}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#263120;color:white;padding:14px 22px;border-radius:30px;z-index:200;font-size:12px;max-width:90vw;white-space:nowrap}.empty{text-align:center;padding:55px 10px;color:#7d8677}select{border:1px solid #dce2d4;border-radius:9px;padding:9px;background:white;font-size:12px}.footer-note{font-size:10px;color:#a0a895;margin-top:20px}@media(min-width:600px){#app{margin:25px auto;border-radius:35px;box-shadow:0 20px 70px #26321b20;border:8px solid #fff}nav{border-radius:0 0 25px 25px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><div id="app"></div><script>
const booths=[{id:1,name:'모스라이트',en:'MOSS / LIGHT',genre:'어드벤처',floor:'1F',num:'A-12',color:'#becdb0',ink:'#354e2c',art:'moss.',score:92,desc:'빛을 잃어버린 숲에서, 작은 이끼가 길을 밝힙니다. 손끝으로 빛을 옮기며 숲의 기억을 되찾는 감성 퍼즐 어드벤처.',tags:['퍼즐','탐험','힐링'],x:93,y:134},{id:2,name:'네온 드리프터',en:'NEON DRIFTER',genre:'액션',floor:'1F',num:'A-18',color:'#c5b5e1',ink:'#432e73',art:'NEON',score:88,desc:'잠들지 않는 도시, 마지막 배달을 완수하세요. 네온빛 골목을 질주하는 리듬 액션 게임.',tags:['리듬','액션','사이버펑크'],x:328,y:134},{id:3,name:'오빗 포스트',en:'ORBIT POST',genre:'어드벤처',floor:'1F',num:'B-04',color:'#e9bb8e',ink:'#864d2c',art:'ORBIT',score:95,desc:'우주에서 가장 느린 우체부의 이야기. 작은 행성 사이를 여행하며 전하지 못한 마음을 배달하는 탐험 게임.',tags:['탐험','스토리','힐링'],x:328,y:277},{id:4,name:'페이퍼 가든',en:'PAPER GARDEN',genre:'시뮬레이션',floor:'2F',num:'C-08',color:'#e5c0c6',ink:'#7e434d',art:'paper',score:90,desc:'종이 한 장에서 시작되는 나만의 정원. 접고 오리고 가꾸며 작은 생태계를 만들어 보세요.',tags:['꾸미기','힐링'],x:93,y:277},{id:5,name:'딥 블루',en:'DEEP BLUE',genre:'어드벤처',floor:'B1F',num:'D-03',color:'#a8cbd8',ink:'#2e5869',art:'DEEP',score:86,desc:'해저 관측 기지에서 발견한 알 수 없는 신호. 바닷속을 탐험하며 숨겨진 이야기를 수집하세요.',tags:['탐험','스토리'],x:328,y:134}];
let saved;try{saved=JSON.parse(localStorage.getItem('beaverocks26')||'{}')}catch{}let reviews=saved?.reviews||[],visited=saved?.visited||[],page='home',selected=1,floor='1F',filter='전체',query='',routeTo=null,origin=1,rating=90,sort='popular';const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('beaverocks26',JSON.stringify({reviews,visited}))}catch{toast('이 브라우저에서는 기록 저장이 제한돼요')}}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2700)}
function nav(){return `<nav><button class="${page==='home'?'active':''}" onclick="go('home')"><i>⌖</i>발견 지도</button><button class="${page==='critics'?'active':''}" onclick="go('critics')"><i>❞</i>부스 평론</button><button class="${page==='record'?'active':''}" onclick="go('record')"><i>▤</i>나의 기록</button></nav>`}function go(p){page=p;render();window.scrollTo(0,0)}function detail(id){selected=id;go('detail')}function art(b,big=false){return `<div class="art ${big?'big-art':''}" style="background:${b.color};color:${b.ink}"><b>${b.art}</b>${!big?`<span class="score">${b.score}</span>`:''}</div>`}function card(b){return `<button class="card" onclick="detail(${b.id})">${art(b)}<div class="card-info"><h3>${b.name}</h3><span>${b.num} · ${b.genre} ${visited.includes(b.id)?'· 방문 완료':''}</span></div></button>`}function head(title){return `<div class="row"><button class="back" aria-label="뒤로" onclick="go('home')">‹</button><small>${title}</small><span>2026</span></div>`}
function routePath(){const ring=[[93,134],[328,134],[328,277],[93,277]],a=booths.find(b=>b.id===origin),b=booths.find(b=>b.id===routeTo);let i=ring.findIndex(p=>p[0]===a.x&&p[1]===a.y),end=ring.findIndex(p=>p[0]===b.x&&p[1]===b.y),pts=[ring[i]];for(let n=0;n<4;n++){i=(i+1)%4;pts.push(ring[i]);if(i===end)break}return pts.map((p,n)=>(n?'L':'M')+p.join(' ')).join(' ')}function map(){let bs=booths.filter(b=>b.floor===floor);return `<div class="map"><div class="map-note">BEAVEROCKS 2026 / ${floor} <br><br>행사장 예시 지도</div><svg viewBox="0 0 420 390" aria-label="부스 배치 지도"><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#e3e7dc" stroke-width=".6"/></pattern></defs><rect width="420" height="390" fill="url(#grid)"/><path d="M-20 204H440M210 80V400" stroke="white" stroke-width="50"/><rect x="148" y="158" width="124" height="94" rx="38" fill="#dce2d0"/><text x="210" y="207" text-anchor="middle" font-size="10" fill="#8a947d">BEAVER LOUNGE</text>${[45,123,280,358].map(x=>`<rect x="${x}" y="85" width="27" height="34" rx="4" fill="#e1e4d8"/><rect x="${x}" y="301" width="27" height="30" rx="4" fill="#e1e4d8"/>`).join('')}${routeTo?`<path class="route" d="${routePath()}"/><text x="240" y="235" fill="#65832d" font-size="22">→</text>`:''}${bs.map(b=>`<g class="marker" role="button" tabindex="0" aria-label="${b.name}" onclick="detail(${b.id})" onkeydown="if(event.key==='Enter')detail(${b.id})"><rect x="${b.x-48}" y="${b.y-23}" width="96" height="46" rx="10" fill="${b.color}" stroke="${routeTo===b.id?'#52771f':'white'}" stroke-width="2"/><text x="${b.x}" y="${b.y-3}" text-anchor="middle" font-size="10" fill="${b.ink}">${b.num}</text><text x="${b.x}" y="${b.y+12}" text-anchor="middle" font-weight="bold" font-size="11" fill="${b.ink}">${b.name}</text></g>`).join('')}<circle cx="${booths.find(b=>b.id===origin).x}" cy="${booths.find(b=>b.id===origin).y}" r="19" fill="#5384ff" opacity=".12"/><circle cx="${booths.find(b=>b.id===origin).x}" cy="${booths.find(b=>b.id===origin).y}" r="8" fill="#5384ff" stroke="white" stroke-width="3"/><text x="110" y="207" font-size="10" fill="#5d7dba">${origin===1?'내 위치':esc(booths.find(b=>b.id===origin).num)}</text><text x="205" y="365" font-size="10" fill="#9ba38f">ENTRANCE ↓</text></svg><div class="floors">${['B1F','1F','2F'].map(f=>`<button class="${floor===f?'on':''}" onclick="floor='${f}';render()">${f}</button>`).join('')}</div><button class="locate" aria-label="내 위치" onclick="floor=booths.find(b=>b.id===origin).floor;render();toast('최근 인식한 부스 기준 위치예요')">⌖</button></div>`}
function home(){let list=booths.filter(b=>(filter==='전체'||b.genre===filter)&&(!query||[b.name,b.genre,b.num,...b.tags].join(' ').toLowerCase().includes(query.toLowerCase())));return `<header><div class="top"><div><div class="brand">BEAVEROCKS<span style="color:#87a84a">.</span></div><div class="edition">2026 · PLAY. DISCOVER. CRITIQUE.</div></div><button aria-label="내 기록" onclick="go('record')" style="font-size:25px">♙</button></div><div class="search"><input aria-label="부스 검색" placeholder="어떤 게임을 발견하고 싶나요?" value="${esc(query)}" oninput="query=this.value;document.getElementById('results').innerHTML=searchResults()"><button class="camera" aria-label="부스 촬영" onclick="go('camera')">▣</button></div></header><div class="chips">${['전체','어드벤처','액션','시뮬레이션'].map(t=>`<button class="chip ${filter===t?'on':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}<button class="chip" onclick="toast('화장실은 입구 오른쪽, 라운지 옆에 있어요')">화장실</button></div>${map()}<section class="sheet"><div class="handle"></div>${routeTo?`<div class="route-box"><small>시계방향 추천 동선 · 예시</small><p><strong>${booths.find(b=>b.id===routeTo).name}</strong>까지 약 2분</p><div style="font-size:12px">라운지를 오른쪽에 두고 화살표를 따라가세요.</div><button class="primary" onclick="arrive()">도착했어요</button><button class="secondary" onclick="routeTo=null;render()">안내 종료</button></div>`:''}<div id="results">${searchResults()}</div><div class="banner"><div><small>YOUR CRITIC ERA</small><p style="margin:7px 0 0">오늘의 발견을 <strong>한 줄의 평론으로.</strong></p></div><button style="font-size:24px" onclick="go('critics')">↗</button></div><p class="footer-note">프로토타입 · 부스와 평점은 시연용 데이터입니다.</p></section>`}
function searchResults(){let list=booths.filter(b=>(filter==='전체'||b.genre===filter)&&(!query||[b.name,b.genre,b.num,...b.tags].join(' ').toLowerCase().includes(query.toLowerCase())));return `<div class="section-title"><h2>${query?'검색 결과':'지금, 발견할 부스'}</h2><a>${String(list.length).padStart(2,'0')} BOOTHS</a></div><p class="muted">${query?'끌리는 부스를 눌러 자세히 살펴보세요.':'작은 부스에서 만나는, 커다란 새로운 세계.'}</p><div class="cards">${list.length?list.map(card).join(''):'<p class="muted">일치하는 부스가 없어요.</p>'}</div>`}
function detailPage(){let b=booths.find(b=>b.id===selected);return `<section class="page">${head('BOOTH DISCOVERY')}${art(b,true)}<div class="row"><small>${b.num} · ${b.floor}</small><span class="label">${visited.includes(b.id)?'✓ 방문 완료':'NEW DISCOVERY'}</span></div><h1>${b.name}</h1><div class="edition">${b.en}</div><p class="detail-copy">${b.desc}</p>${b.tags.map(t=>`<span class="label">${t}</span>`).join('')}<div class="stat"><div><b>${b.score}</b>관람객 평점 · 예시</div><div><b>${reviews.filter(r=>r.booth===b.id).length}</b>내가 남긴 평론</div><div><b>10분</b>예상 플레이</div></div><button class="primary" onclick="rating=90;go('write')">❞ 이 부스 평론하기</button><button class="secondary" onclick="markVisit(${b.id})">${visited.includes(b.id)?'✓ 방문 기록됨':'방문했어요'}</button><button class="secondary" onclick="startRoute(${b.id})">↗ 이 부스로 길찾기</button><button class="secondary" onclick="toast('실제 부스 소개 영상과 공식 링크가 연결될 자리예요')">▷ 게임 소개 영상 · 공식 링크</button><p class="footer-note">실제 행사 부스 정보로 교체할 수 있는 예시 화면입니다.</p></section>`}
function cameraPage(){return `<section class="page">${head('SCAN & DISCOVER')}<h1>지금, 어느 부스인가요?</h1><p class="muted">간판을 프레임에 맞추면 새로운 발견이 시작돼요.</p><div class="camera-view"><div class="sign">MOSS / LIGHT<br><small>BOOTH A-12</small></div><div class="scanline"></div><div class="camera-caption">부스 이름과 번호가 보이도록 맞춰주세요</div></div><button class="primary" id="scanBtn" onclick="scan()">◎ 촬영하고 부스 확인하기</button><p class="notice">체험용 촬영 화면이에요. 버튼을 누르면 모스라이트 부스를 인식한 결과와 해당 위치를 확인할 수 있어요.</p></section>`}
function scan(){let btn=document.querySelector('#scanBtn');btn.disabled=true;btn.textContent='간판을 확인하고 있어요…';setTimeout(()=>{selected=1;origin=1;floor='1F';markVisit(1,false);go('detail');toast('A-12 모스라이트 확인 · 내 위치가 갱신됐어요')},1100)}function markVisit(id,show=true){if(!visited.includes(id)){visited.push(id);save()}if(show){render();toast('방문 기록에 저장했어요')}}
function writePage(){let b=booths.find(b=>b.id===selected);return `<section class="page">${head('WRITE YOUR CRITIQUE')}<p class="eyebrow" style="margin-top:35px;color:#83906f">YOU ARE THE CRITIC</p><h1>당신의 한 줄이<br>이 게임의 다음 장면.</h1><p class="muted">${b.name} · ${b.num}</p><div class="row"><div><span class="rating-number" id="rating">${rating}</span><span class="muted"> / 100</span></div><span class="label">나의 평점</span></div><input type="range" aria-label="평점" min="0" max="100" value="${rating}" oninput="rating=Number(this.value);document.querySelector('#rating').textContent=rating"><form onsubmit="publish(event)"><textarea name="review" required minlength="5" maxlength="180" placeholder="무엇이 마음에 남았나요? 당신만의 시선으로 남겨주세요." oninput="document.querySelector('#count').textContent=this.value.length"></textarea><div style="text-align:right;font-size:10px;color:#88917e"><span id="count">0</span> / 180</div><input class="name" name="nickname" maxlength="20" placeholder="평론가 이름 (선택, 기본: 익명의 비버)"><label style="display:flex;gap:9px;font-size:12px;line-height:1.6"><input type="checkbox" required>행사 부스 모니터에 닉네임과 평론이 공개되는 데 동의해요.</label><p class="notice">이 프로토타입은 내 브라우저에만 기록돼요. 실제 모니터 전송 대신 공개 화면을 미리 보여드려요.</p><button class="primary" type="submit">평론 공개하기 ↗</button></form></section>`}
function publish(e){e.preventDefault();let data=new FormData(e.target),r={id:Date.now(),booth:selected,text:String(data.get('review')).trim(),name:String(data.get('nickname')).trim()||'익명의 비버',score:rating};if(r.text.length<5){toast('평론을 5자 이상 작성해 주세요');return}reviews.unshift(r);markVisit(selected,false);save();let overlay=document.createElement('div');overlay.className='published';overlay.innerHTML=`<div class="published-inner"><small>BEAVEROCKS 2026 · CRITICS' CHOICE</small><div class="rating-number" style="margin-top:35px">${r.score}<span style="font-size:17px;letter-spacing:0"> / 100</span></div><blockquote>“${esc(r.text)}”</blockquote><div class="edition">${esc(booths.find(b=>b.id===selected).name)} — ${esc(r.name)}</div><p style="font-size:11px;color:#9fae92;margin-top:30px">평론 공개 연출 미리보기 · 내 기록 저장 완료</p><button class="primary" onclick="document.querySelector('.published').remove();go('recommend')">다음 발견으로 이어가기 ↗</button><button class="secondary" onclick="document.querySelector('.published').remove();go('critics')">평론 모아보기</button></div>`;document.body.append(overlay)}
const seeds=[{booth:1,score:92,name:'숲을 걷는 비버',text:'작은 빛 하나로, 거대한 숲을 기억하게 만드는 게임.'},{booth:3,score:95,name:'행성 수집가',text:'배달한 건 편지였는데, 돌아온 건 오래 잊고 있던 마음이었다.'},{booth:2,score:88,name:'프레임 헌터',text:'한 판만 더. 이 도시에서 가장 위험한 말.'}];
function criticPage(record=false){let list=record?reviews:[...reviews,...seeds];if(!record&&filter!=='전체')list=list.filter(r=>booths.find(b=>b.id===r.booth).genre===filter);if(sort==='score')list=[...list].sort((a,b)=>b.score-a.score);return `<section class="page">${head(record?'MY DISCOVERIES':'THE CRITICS CLUB')}<p class="eyebrow" style="margin-top:30px">${record?'YOUR FESTIVAL, ARCHIVED.':'EVERY PLAYER HAS A VOICE.'}</p><h1>${record?'나의 발견 기록':'플레이 뒤에 남은 말들.'}</h1><p class="muted">${record?`방문 ${visited.length}개 · 평론 ${reviews.length}개`:'부스마다 쌓이는, 관람객의 진짜 시선.'}</p>${record?`<div class="cards">${visited.length?visited.map(id=>card(booths.find(b=>b.id===id))).join(''):'<p class="muted">아직 방문 기록이 없어요. 첫 부스를 발견해 보세요.</p>'}</div><h2>내가 남긴 평론</h2>`:`<div class="row"><select aria-label="장르 필터" onchange="filter=this.value;render()">${['전체','어드벤처','액션','시뮬레이션'].map(t=>`<option ${filter===t?'selected':''}>${t}</option>`).join('')}</select><select aria-label="평론 정렬" onchange="sort=this.value;render()"><option value="popular" ${sort==='popular'?'selected':''}>최신순</option><option value="score" ${sort==='score'?'selected':''}>높은 평점순</option></select></div>`}${list.map(r=>`<article class="review"><div class="row"><button onclick="detail(${r.booth})"><small>${booths.find(b=>b.id===r.booth).name} ↗</small></button><span class="rating">${r.score}</span></div><blockquote>“${esc(r.text)}”</blockquote><span class="muted">${esc(r.name)} · ${r.id?'나의 평론':'예시 평론'}</span></article>`).join('')}${!list.length?'<div class="empty">아직 평론이 없어요.<br>첫 번째 평론가가 되어주세요.</div>':''}${record?'<button class="primary" onclick="go(\'home\')">새로운 부스 발견하기</button>':''}</section>`}
function recommend(){let b=booths.find(b=>b.id===selected),list=booths.filter(x=>x.id!==b.id).sort((a,c)=>c.tags.filter(t=>b.tags.includes(t)).length-a.tags.filter(t=>b.tags.includes(t)).length).slice(0,2);return `<section class="page">${head('YOUR NEXT DISCOVERY')}<p class="eyebrow" style="margin-top:40px">THE ADVENTURE CONTINUES</p><h1>이 여운을,<br>다음 부스로.</h1><p class="muted">${b.name}의 ${b.tags[0]}을 좋아했다면<br>이런 발견은 어떨까요?</p>${list.map(x=>`<div style="margin-top:23px">${art(x,true)}<div class="row"><h2>${x.name}</h2><span class="label">${x.floor} · ${x.num}</span></div><p class="muted">${x.tags.join(' · ')}</p><button class="primary" onclick="startRoute(${x.id})">↗ ${x.floor===b.floor?'시계방향 동선으로':'층 이동 포함'} 길찾기</button></div>`).join('')}</section>`}
function startRoute(id){let b=booths.find(b=>b.id===id);if(id===origin){toast('최근 인식한 현재 부스예요');return}routeTo=id;floor=b.floor;go('home');if(b.floor!==booths.find(x=>x.id===origin).floor)toast('층 이동 후 목적지 층의 예시 동선을 표시해요')}
function arrive(){selected=routeTo;origin=selected;markVisit(selected,false);routeTo=null;go('detail');toast('도착했어요! 방문 기록을 남겼어요')}
function render(){app.innerHTML=`<div class="status"><span>9:41</span><span>▮▮▮  ◉  ▰</span></div>${page==='home'?home():page==='detail'?detailPage():page==='camera'?cameraPage():page==='write'?writePage():page==='recommend'?recommend():criticPage(page==='record')}${nav()}`;}render();
</script></html>
